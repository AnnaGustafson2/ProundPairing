<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Pairing App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <h1>MPDS Pround Pairing</h1>

        <section id="attendance-section">
            <h2>1. Who's prounding today?</h2>
            <div id="member-checklist" class="checklist">
                <p class="muted">Loading members…</p>
            </div>
            <button id="start-session-btn" disabled>Start Session</button>
        </section>

        <section id="constraints-section" class="hidden">
            <h2>2. Pairing rules for today</h2>
            <div class="constraint-form">
                <select id="constraint-type">
                    <option value="PAIR">Pair together</option>
                    <option value="AVOID">Keep apart</option>
                </select>
                <select id="member-a"></select>
                <span>and</span>
                <select id="member-b"></select>
                <button id="add-constraint-btn">Add</button>
            </div>
            <ul id="constraint-list"></ul>
        </section>

        <section id="generate-section" class="hidden">
            <h2>3. Generate groups</h2>
            <button id="generate-btn">Generate Groups</button>
            <div id="results"></div>
        </section>

        <p id="status-message" class="muted"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
