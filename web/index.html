<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Pround Pairing — American Parliamentary Debate pairing and attendance management.">
        <title>Pround Pairing</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <section class="header-bar">
                <h1>MPDS Pround Pairing</h1>
            </section>
        </header>

        <section id="member-container">
            <form>
                <label for="member-names">Enter Member Names:</label>
                <input type="text" id="member-names" name="member-names">
            </form>
            <div id="add-buttons">
                <p id="current-name"></p>
                <button id="neutral-add">Add</button>
                <button id="gov-add">Add as GOV</button>
                <button>Add as Judge</button>
                <button>Add as OPP</button>
            </div>
        </section>

        <section class="participants-container">
            <h2>Participants</h2>
            <h3>Drag debaters together to form teams</h3>
        </section>

        <section class="rounds-container">
            <h2>Round(s)</h2>
            <h3>Drop teams or debaters into a round</h3>
            <div class="round">
                <div class="debater-landing-zone">Speaker One</div>
                <div class="debater-landing-zone">Speaker Two</div>
                <div class="debater-landing-zone">Opponent One</div>
                <div class="debater-landing-zone">Opponent Two</div>
                <div class="debater-landing-zone">Judge</div>
            </div>
        </section>
        <button>Save Attendance</button>
        <button id="add-round">Add Round</button>
        <script src="app.js"></script>
    </body>
</html>
