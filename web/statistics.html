<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Pround Pairing — American Parliamentary Debate pairing and attendance management.">
        <title>Pround Pairing</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <section class="header-bar">
                <h1>MPDS Statistics</h1>
            </section>
        </header>
        <div id="utility-buttons">
            <button class="gold-button" id="pround-pairing">Pround Pairing</button>
        </div>

        <div id="tooltip" style="display:none"></div>
        <div class="statistics-container"> 
            <div id="controls">
                <div id="slider"></div>
                X: <select id="xVariable" class="variable"></select>
                Y: <select id="yVariable" class="variable"></select>
                size: <select id="sizeVariable" class="variable"></select>
            </div>
            <div id="vis"></div> 
        </div>

        <script src="https://d3js.org/d3.v7.js"></script>
        <script src="https://unpkg.com/d3-simple-slider"></script>
        <script src="statistics.js"></script>
    </body>
</html>
